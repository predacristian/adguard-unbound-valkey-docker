name: CI

# PRs and Renovate branches run the shared test suite. Pushes to main are
# validated by release.yml, which runs the same suite before publishing.

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  push:
    # Renovate branch automerge (automergeType: branch) needs the
    # requiredStatusChecks to actually run on the pushed branch.
    branches: [ "renovate/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  merge_group:
    branches: [ main ]

concurrency:
  group: dns-stack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
