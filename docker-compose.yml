services:
  dns-stack:
    build:
      context: .
      dockerfile: Dockerfile
      # Versions come from the Dockerfile defaults; Renovate updates those.
    image: dns-stack:latest
    container_name: dns-stack
    restart: unless-stopped

    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"
      # AdGuard Home Web UI
      - "3000:3000/tcp"
      # Enable these only after turning on tls.enabled in the AdGuard config:
      # - "853:853/tcp"     # DNS over TLS
      # - "8443:443/tcp"    # HTTPS / DoH

    volumes:
      # Persist configuration
      - ./data/config:/config
      # Mount tests for easy testing
      - ./tests:/tests:ro

    environment:
      # Customize as needed
      TZ: "UTC"
      # ADGUARD_PASSWORD: "YourSecurePassword"  # Recommended: Set a custom password
      # ADGUARD_USERNAME: "admin"  # Optional: Custom username (default: admin)

    # Required for low-numbered ports and network performance
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE

    # Network performance tuning (optional, comment out if not needed)
    # sysctls:
    #   - net.core.rmem_max=8388608
    #   - net.core.wmem_max=8388608

    healthcheck:
      test: ["CMD", "sh", "-c", "dig +time=5 +tries=1 +short @127.0.0.1 -p 5335 example.com 2>/dev/null | grep -qv '^;;' && /usr/local/bin/valkey-cli -s /tmp/valkey.sock ping >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

    networks:
      - dns-network

networks:
  dns-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
